# Nginx reçoit les visiteurs et transmet au backend Node, qui reste invisible de l'extérieur.
# __DOMAINES__ est remplacé par installer.sh ; certbot ajoute ensuite la partie HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINES__;

    server_tokens off;

    # Le backend applique ses propres limites (3 Mo par photo) : celle-ci ne doit pas les devancer.
    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Remplace l'en-tête reçu : un visiteur ne peut pas se faire passer pour une autre adresse IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
